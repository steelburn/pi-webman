name: publish

# Publishing happens in CI, never from a laptop.
#
# Auth is npm Trusted Publishing (OIDC): there is no NPM_TOKEN secret, nothing
# to rotate, and every tarball carries a provenance attestation. One-time setup
# on https://www.npmjs.com/package/pi-webman → Settings → Trusted publishing:
#
#   Publisher:      GitHub Actions
#   Organization:   steelburn
#   Repository:     pi-webman
#   Workflow name:  publish.yml
#   Environment:    (none)
#
# Cut a release:
#   1. npm version patch|minor|major --no-git-tag-version   (edits package.json)
#   2. commit, push to main
#   3. GitHub → Releases → "Draft a new release" → tag v<version> → Publish
#      (or run this workflow manually against an existing tag)
#
# The job is idempotent: if the version is already on npm it reports that and
# exits successfully instead of failing the release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v0.2.0 (defaults to the selected ref)
        required: false
        type: string

permissions:
  contents: read
  id-token: write # OIDC: Trusted Publishing + provenance

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref
        id: ref
        run: |
          ref="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$ref" ]; then
            ref="${GITHUB_REF#refs/tags/}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Publishing $ref"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Use the newest npm (Trusted Publishing needs >= 11.5.1)
        run: |
          npm install --global npm@latest
          npm --version

      - name: Verify the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${{ steps.ref.outputs.ref }}"
          if [ -n "$tag" ] && [ "${tag#v}" != "$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Install
        run: npm ci

      - name: Build, typecheck, lint UI
        run: npm run check

      - name: Publish
        env:
          NODE_AUTH_TOKEN: "" # always prefer OIDC over any stray token
        run: |
          name=$(node -p "require('./package.json').name")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm — nothing to do"
            exit 0
          fi

          set +e
          npm publish --provenance --access public 2>&1 | tee /tmp/publish.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::notice::published $name@$version with provenance"
            exit 0
          fi

          if grep -q 'ENEEDAUTH' /tmp/publish.log; then
            echo "::error::npm rejected the publish: no trusted publisher is configured for $name."
            echo "Open https://www.npmjs.com/package/$name → Settings → Trusted publishing and add:"
            echo "  publisher    GitHub Actions"
            echo "  repository   ${GITHUB_REPOSITORY}"
            echo "  workflow     publish.yml"
            echo "Or, locally: npx npm@11 trust github $name --file publish.yml --repo ${GITHUB_REPOSITORY} --allow-publish"
            exit "$status"
          fi

          # The trusted publisher may grant stage-publish only, which makes
          # `npm publish` answer "OIDC permission denied". Staging is the
          # intended flow then: CI uploads the attested tarball and a maintainer
          # approves it with 2FA.
          if grep -q 'OIDC permission denied' /tmp/publish.log; then
            echo "::notice::direct publish is not granted — staging $name@$version instead"
            npm stage publish --provenance --access public 2>&1 | tee /tmp/stage.log
            stage_id=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|stage-[A-Za-z0-9_-]{6,}' /tmp/stage.log | head -1 || true)
            {
              echo "### Staged: $name@$version"
              echo
              echo "The trusted publisher allows stage-publish only, so CI uploaded the"
              echo "attested tarball and stopped. Approval needs proof of presence (2FA)."
              echo
              if [ -n "$stage_id" ]; then echo "- stage id: \`$stage_id\`"; echo "- approve: \`npx npm@11 stage approve $stage_id\`"; fi
              echo "- or approve in the web UI: https://www.npmjs.com/package/$name (Staged packages)"
              echo "- inspect: `npx npm@11 stage view <id>`"
              echo "- to publish unattended next time, enable **Publish** on the trusted publisher"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::staged $name@$version — $stage_id — approve it to go live"
            exit 0
          fi

          echo "::error::publish failed for a reason other than auth:"
          tail -20 /tmp/publish.log
          exit "$status"

      - name: Summarize
        if: always()
        run: |
          name=$(node -p "require('./package.json').name")
          {
            echo "### $name@${{ env.version }}"
            echo
            echo "- ref: \`${{ steps.ref.outputs.ref }}\`"
            echo "- [package on npm](https://www.npmjs.com/package/$name)"
            echo "- [catalog entry](https://pi.dev/packages/$name)"
          } >> "$GITHUB_STEP_SUMMARY"
